    {
      "@context": "https://schema.org",

    <!-- ── Structured data: FAQPage ─────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Solo hacen automatizaciones o también campañas y contenido?",
          "acceptedAnswer": { "@type": "Answer", "text": "Somos un partner de growth completo. Hacemos paid media (Meta y Google Ads), contenido y edición de video, automatización con IA, CRM y analítica. Puedes tomar un solo servicio o combinarlos en un sistema integral." }
        },
        {
          "@type": "Question",
          "name": "¿Puedo contratar solo la gestión de mis campañas de Meta o Google?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Muchos clientes empiezan exactamente así: nosotros administramos y optimizamos su inversión publicitaria, mientras ellos siguen con el resto de su operación." }
        },
        {
          "@type": "Question",
          "name": "¿Hacen edición de video y manejo de redes?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Planificamos tu grilla mensual de contenido, producimos y editamos tus reels y shorts, y dejamos tu feed publicando de forma constante y profesional. No requiere ninguna automatización." }
        },
        {
          "@type": "Question",
          "name": "¿Cómo cobran? ¿Por proyecto o mensual?",
          "acceptedAnswer": { "@type": "Answer", "text": "Ambos. Ofrecemos proyectos puntuales, retainers mensuales y sistemas completos de growth. El alcance y el modelo los definimos juntos según tu etapa." }
        },
        {
          "@type": "Question",
          "name": "¿En cuánto tiempo veo resultados?",
          "acceptedAnswer": { "@type": "Answer", "text": "Depende del servicio. Una campaña bien montada puede traer leads en los primeros días; un sistema de automatización o una estrategia de contenido muestran su mayor impacto entre la cuarta semana y el segundo mes." }
        },
        {
          "@type": "Question",
          "name": "¿Y si no sé exactamente qué necesito?",
          "acceptedAnswer": { "@type": "Answer", "text": "Es lo más común y para eso está la sesión estratégica gratuita. Auditamos tu situación, identificamos la mayor oportunidad de crecimiento y te recomendamos por dónde partir." }
        }
      ]
    }
    </script>
