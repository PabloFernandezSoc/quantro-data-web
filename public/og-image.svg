  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(96,150) scale(1.1)">
    <rect width="100" height="100" rx="24" fill="url(#mark)"/>
    <circle cx="45" cy="55" r="21" fill="none" stroke="#fff" stroke-width="6.5" opacity="0.95"/>
    <path d="M39 61 L60 40" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M49 38 L63 38 L63 52" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="232" y="232" font-family="DM Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#EDEDEF">
